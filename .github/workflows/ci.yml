name: Numerical and application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact finite identities
        run: |
          python verify_identities.py
          python verify_details.py
      - name: Check data, numerical behaviour and application pages
        run: python -m unittest discover -s tests -v
      - name: Redraw manuscript figures from saved data
        run: python reproduce.py --figures-only
